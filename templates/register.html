{% extends "base.html" %}
{% block content %}

<style>
    body {
        background: linear-gradient(135deg, #0d6efd, #6610f2);
    }

    .register-card {
        max-width: 450px;
        margin: 80px auto;
        padding: 30px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        backdrop-filter: blur(10px);
    }

    .register-title {
        font-weight: 700;
        text-align: center;
        margin-bottom: 20px;
        color: #198754;
    }

    .form-control {
        border-radius: 10px;
        padding: 12px;
    }

    .btn-register {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        background: linear-gradient(135deg, #198754, #20c997);
        border: none;
        font-weight: 600;
    }

    .btn-register:hover {
        opacity: 0.9;
    }

    .link {
        display: block;
        text-align: center;
        margin-top: 15px;
        text-decoration: none;
    }
</style>

<div class="register-card">

    <h2 class="register-title">🧑‍⚕️ Create Account</h2>

    <form method="POST">

        <div class="mb-3">
            <label>Username</label>
            <input name="username" class="form-control" placeholder="Choose a username">
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" placeholder="Create password">
        </div>

        <button class="btn btn-success btn-register">
            ✅ Register
        </button>

    </form>

    <a href="/login" class="link text-primary">
        Already have an account? Login
    </a>

</div>

{% endblock %}
